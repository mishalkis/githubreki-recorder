name: record
on:
  workflow_dispatch:
    inputs:
      demo: { description: "slug сценария из demos/<slug>.json", default: krita }
permissions:
  contents: read
jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: record
        shell: pwsh
        env:
          DEMO: ${{ inputs.demo }}
        run: |
          if ($env:DEMO -notmatch '^[a-z0-9-]+$') { throw 'bad demo name' }
          ./scripts/record.ps1 -Demo $env:DEMO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: out/
